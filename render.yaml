# Blueprint da Render para a demo pública (plano gratuito). Banco: PostgreSQL da Neon (gratuito, não expira).
services:
  - type: web
    name: pixsettle-demo
    runtime: docker
    plan: free
    region: virginia          # mesma região do banco na Neon (AWS us-east-1): cada consulta ao banco fica rápida
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL        # cole a connection string da Neon (termina com ?sslmode=require)
        sync: false
      - key: PIXSETTLE_SEED      # semente das chaves de TESTNET; gerada pela Render, ninguém copia chave à mão
        generateValue: true
      - key: DIAGNOSTICS_TOKEN
        generateValue: true
      - key: ASAAS_WEBHOOK_TOKEN
        generateValue: true
      - key: SWEEP_INTERVAL_MS
        value: "60000"
      # Piloto (eventos atestados da plataforma multiloja) e copiloto de exceções. Ver docs/pilot.md e docs/ai-copilot.md.
      - key: PILOT_HMAC_SECRET   # segredo compartilhado com o exportador da loja; sem ele a ingestão recusa tudo (o painel continua)
        generateValue: true
      - key: PILOT_OPERATOR_TOKEN  # token das decisões do operador na fila de exceções
        generateValue: true
      - key: PILOT_SETTLE        # Piloto histórico: nenhuma liquidação de fundos.
        value: "0"
      - key: COPILOT_MODE        # off | replay | live | live_record (chave só em COPILOT_API_KEY, nunca aqui)
        value: "replay"
      - key: COPILOT_MODEL
        value: "openai/gpt-4.1-mini"
      - key: COPILOT_PROVIDER
        value: "openai"
      - key: COPILOT_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: COPILOT_API_KEY
        sync: false
      - key: COPILOT_BUDGET_CALLS_PER_DAY
        value: "0"
      - key: COPILOT_BUDGET_MICROS
        value: "0"
      - key: PUBLIC_REPLAY_READ_ONLY
        value: "1"
      - key: PILOT_SHADOW_PUBLIC
        value: "1"
      - key: PILOT_V1_DISABLED
        value: "1"
      - key: PILOT_SHADOW_KEYRING_JSON
        sync: false
      - key: PILOT_SHADOW_TOKENS_JSON
        sync: false
